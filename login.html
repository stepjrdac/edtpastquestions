<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Login</title>
<link rel="stylesheet" href="style.css">
<style>
.card{background:#fff;margin:24px;padding:24px;border-radius:20px;box-shadow:0 6px 16px rgba(79,70,229,.2)}
input{width:100%;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:12px;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:var(--main);color:#fff;font-size:17px;font-weight:bold}
button.alt{background:var(--accent)}
#msg{margin-top:12px;text-align:center;color:#dc2626}
header{padding-top:50px}
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>
<header><h1>🎓 Welcome</h1><p>Sign up or log in</p></header>
<div class="card">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (min 6 characters)">
  <button onclick="login()">Log In</button>
  <button class="alt" onclick="signup()">Create Account</button>
  <p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const msg = document.getElementById("msg");
const val = id => document.getElementById(id).value.trim();

async function signup(){
  const { error } = await sb.auth.signUp({ email: val("email"), password: val("password") });
  if (error) msg.textContent = error.message;
  else location.href = "index.html";
}
async function login(){
  const { error } = await sb.auth.signInWithPassword({ email: val("email"), password: val("password") });
  if (error) msg.textContent = error.message;
  else location.href = "index.html";
}
</script>
<script src="install.js"></script>
</body>
</html>
